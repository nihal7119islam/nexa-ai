<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexa AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0f19;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: #111827;
            border-bottom: 1px solid #263244;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .clear {
            background: #1f2937;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Chat area */
        .chat {
            height: calc(100vh - 135px);
            overflow-y: auto;
            padding: 20px 15px;
        }

        .welcome {
            text-align: center;
            margin-top: 18vh;
        }

        .robot {
            font-size: 55px;
        }

        .welcome h1 {
            margin: 12px 0;
        }

        .welcome p {
            color: #94a3b8;
        }

        /* Messages */
        .message {
            max-width: 850px;
            margin: 12px auto;
            padding: 13px 16px;
            border-radius: 15px;
            line-height: 1.6;
        }

        .user {
            background: #2563eb;
            margin-left: auto;
            width: fit-content;
            max-width: 80%;
        }

        .ai {
            background: #1e293b;
            margin-right: auto;
            max-width: 85%;
        }

        /* Input area */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #111827;
            border-top: 1px solid #263244;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
        }

        input {
            flex: 1;
            height: 48px;
            border: none;
            outline: none;
            border-radius: 25px;
            padding: 0 18px;
            background: #1f2937;
            color: white;
            font-size: 16px;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .send {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #38bdf8;
            font-size: 20px;
            cursor: pointer;
        }

        .send:active {
            transform: scale(0.95);
        }

        /* Mobile */
        @media (max-width: 600px) {
            .welcome h1 {
                font-size: 25px;
            }

            .welcome p {
                font-size: 14px;
            }

            .message {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">

        <div class="logo">
            🤖 <span>Nexa</span> AI
        </div>

        <button class="clear" onclick="clearChat()">
            Clear
        </button>

    </div>


    <!-- Chat -->
    <div class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="robot">
                🤖
            </div>

            <h1>
                Welcome to Nexa AI
            </h1>

            <p>
                Ask me anything...
            </p>

        </div>

    </div>


    <!-- Input -->
    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask anything..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >

        <button
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>


    <script>

        function sendMessage() {

            const input =
                document.getElementById("question");

            const question =
                input.value.trim();

            if (question === "") {
                return;
            }

            document.getElementById("welcome").style.display = "none";

            const chat =
                document.getElementById("chat");


            // User message
            const userMessage =
                document.createElement("div");

            userMessage.className =
                "message user";

            userMessage.innerText =
                question;

            chat.appendChild(userMessage);

            input.value = "";


            // Demo AI response
            setTimeout(function () {

                const aiMessage =
                    document.createElement("div");

                aiMessage.className =
                    "message ai";

                aiMessage.innerText =
                    "আমি এখনো Demo AI। পরের ধাপে আমাকে OpenAI-এর সঙ্গে connect করা হবে। 🤖";

                chat.appendChild(aiMessage);

                chat.scrollTop =
                    chat.scrollHeight;

            }, 700);


            chat.scrollTop =
                chat.scrollHeight;
        }


        // Clear chat
        function clearChat() {

            document.getElementById("chat").innerHTML = `

                <div class="welcome" id="welcome">

                    <div class="robot">
                        🤖
                    </div>

                    <h1>
                        Welcome to Nexa AI
                    </h1>

                    <p>
                        Ask me anything...
                    </p>

                </div>

            `;
        }

    </script>

</body>
  </html>
